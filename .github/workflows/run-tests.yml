name: Run Python Tests

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تجهيز بيئة بايثون على السحابة
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت أداة الفحص
      - name: Install Pytest
        run: |
          pip install pytest

      # 4. تشغيل الاختبار تلقائياً
      - name: Run Tests
        run: |
          pytest test_calc.py
